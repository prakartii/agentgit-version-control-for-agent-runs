[project]
name = "agentgit-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["agentgit-core", "agentgit-api", "agentgit-cli", "agentgit-index"]

[tool.uv]
package = false

[tool.uv.sources]
agentgit-core = { workspace = true }
agentgit-api = { workspace = true }
agentgit-cli = { workspace = true }
agentgit-index = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = ["packages/core/src", "apps/api/src", "apps/cli/src", "packages/index/src"]

# Strict on core packages; relaxed elsewhere until they stabilise.
[[tool.mypy.overrides]]
module = ["agentgit_core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-ra --strict-markers"


[tool.ruff.lint.isort]
known-first-party = ["agentgit_core", "agentgit_api", "agentgit_cli", "agentgit_index"]
