[project]
name = "agentgit-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
