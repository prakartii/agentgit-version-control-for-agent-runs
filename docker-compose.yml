# Local dev services. The S3-compatible blob store is deferred to Phase 1. Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentgit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgit}
      POSTGRES_DB: ${POSTGRES_DB:-agentgit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgit}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
