name: CI

on:
  pull_request:
  push:
    branches: [main, "phase-*"]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentgit
          POSTGRES_PASSWORD: agentgit
          POSTGRES_DB: agentgit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentgit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src packages/index/src packages/demo_servers packages/agents packages/replay apps
      - run: uv run pytest

  # Dogfooding: this repository's own agent-regression scenario, run by the
  # same composite action other repositories would use.
  agent-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          scenarios: examples/agent-ci
