name: CI

on:
  pull_request:
  push:
    branches: [main, "phase-*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src apps
      - run: uv run pytest
