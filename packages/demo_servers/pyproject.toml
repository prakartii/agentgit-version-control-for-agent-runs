[project]
name = "agentgit-demo-servers"
version = "0.0.0"
description = "Tiny MCP servers used to demo and test AgentGit"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
agentgit-demo-files = "agentgit_demo_servers.files:main"
agentgit-demo-tickets = "agentgit_demo_servers.tickets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgit_demo_servers"]
