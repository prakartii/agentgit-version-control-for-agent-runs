[project]
name = "agentgit-replay"
version = "0.0.0"
description = "Deterministic replay of recorded MCP runs with divergence detection"
requires-python = ">=3.12"
dependencies = ["agentgit-core", "agentgit-proxy"]

[tool.uv.sources]
agentgit-core = { workspace = true }
agentgit-proxy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgit_replay"]
