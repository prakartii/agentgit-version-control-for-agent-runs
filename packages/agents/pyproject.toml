[project]
name = "agentgit-agents"
version = "0.0.0"
description = "Demo agents with a hand-written loop, and the LLM interface they use"
requires-python = ">=3.12"
dependencies = [
  "agentgit-core",
  "anthropic>=1,<3",
  "mcp>=2.3,<3",
  "pydantic>=2",
  "typer>=0.12",
]

[project.scripts]
agentgit-agent = "agentgit_agents.cli:app"

[tool.uv.sources]
agentgit-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgit_agents"]
