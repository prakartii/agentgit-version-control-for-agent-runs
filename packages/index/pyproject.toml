[project]
name = "agentgit-index"
version = "0.0.0"
description = "Postgres index of runs, steps and refs"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2", "alembic>=1.13", "psycopg[binary]>=3.2", "agentgit-core"]

[tool.uv.sources]
agentgit-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgit_index"]
