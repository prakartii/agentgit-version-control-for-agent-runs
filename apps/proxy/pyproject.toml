[project]
name = "agentgit-proxy"
version = "0.0.0"
description = "Transparent recording proxy for MCP"
requires-python = ">=3.12"
dependencies = ["agentgit-core", "agentgit-index"]

[tool.uv.sources]
agentgit-core = { workspace = true }
agentgit-index = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgit_proxy"]
